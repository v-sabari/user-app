# ===== HIGH AVAILABILITY & RESILIENCE CONFIGURATION =====

# =============================================================================
# CONNECTION POOLING (HikariCP - prevents database connection exhaustion)
# =============================================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000

# =============================================================================
# DATABASE RESILIENCE (Connection validation & reconnection)
# =============================================================================
spring.datasource.validation-query=SELECT 1
spring.datasource.test-on-borrow=true
spring.datasource.test-while-idle=true
spring.datasource.test-on-return=false
spring.datasource.time-between-eviction-runs-millis=30000
spring.datasource.num-tests-per-eviction-run=3
spring.datasource.min-evictable-idle-time-millis=1800000

# =============================================================================
# GRACEFUL SHUTDOWN (Zero-downtime deployments)
# =============================================================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# =============================================================================
# THREAD POOL CONFIGURATION (Handle concurrent requests)
# =============================================================================
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# =============================================================================
# ACTUATOR ENDPOINTS (Health monitoring & metrics)
# =============================================================================
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Kubernetes/Render probes
management.health.defaults.enabled=true
management.health.diskspace.enabled=true

# =============================================================================
# METRICS (For monitoring performance)
# =============================================================================
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.logback=true
management.metrics.tags.application=day4-backend
management.metrics.tags.environment=production

# =============================================================================
# TIMEOUT CONFIGURATIONS (Prevent hanging requests)
# =============================================================================
server.connection-timeout=20000
server.tomcat.connection-timeout=20000
spring.mvc.async.request-timeout=30000

# =============================================================================
# JPA/HIBERNATE CONFIGURATION (Database performance)
# =============================================================================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# =============================================================================
# RETRY CONFIGURATION (Automatic error recovery)
# =============================================================================
# Can be used with @Retryable annotation
spring.retry.max-attempts=3
spring.retry.delay=1000

# =============================================================================
# LOGGING FOR HA MONITORING =====
logging.level.root=WARN
logging.level.com.example=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=WARN
logging.level.org.springframework.jdbc.core=DEBUG

# =============================================================================
# SENTRY CONFIGURATION FOR HA =====
sentry.dsn=${SENTRY_DSN:}
sentry.environment=production
sentry.release=1.0.0
sentry.debug=false
sentry.traces-sample-rate=0.1
sentry.enable-tracing=true