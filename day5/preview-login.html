<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Login — redesign preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--canvas:#f3f5f9;--surface:#fff;--surface-sunken:#f8fafc;--ink:#0f172a;--ink-soft:#334155;--muted:#64748b;--faint:#94a3b8;--line:#e2e8f0;--line-strong:#cbd5e1;--primary:#4f46e5;--primary-dark:#4338ca;--primary-soft:#eef2ff;--primary-ring:#4f46e52e;--success:#16a34a;--success-dark:#15803d;--success-soft:#ecfdf5;--warning:#d97706;--warning-dark:#92400e;--warning-soft:#fffbeb;--danger:#dc2626;--danger-dark:#b91c1c;--danger-soft:#fef2f2;--info:#0891b2;--info-soft:#ecfeff;--font-ui:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;--font-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;--r-full:999px;--shadow-xs:0 1px 2px #0f172a0a;--shadow-sm:0 2px 8px #0f172a0f;--shadow-md:0 8px 24px #0f172a14;--shadow-lg:0 24px 56px #0f172a29;--ease:cubic-bezier(.4, 0, .2, 1);--dur-fast:.12s;--dur-med:.22s}
*{box-sizing:border-box}
body{font-family:var(--font-ui);background:var(--canvas);min-height:100vh;color:var(--ink);-webkit-font-smoothing:antialiased;margin:0}
button,input,select{font:inherit}
.btn{justify-content:center;align-items:center;gap:var(--sp-2);font-family:var(--font-ui);border-radius:var(--r-md);cursor:pointer;transition:background var(--dur-fast) var(--ease);white-space:nowrap;border:1px solid transparent;padding:11px 18px;font-size:14px;font-weight:600;line-height:1;display:inline-flex}
.btn-block{width:100%}
.btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-xs)}
.btn-primary:hover{background:var(--primary-dark)}
.auth-screen{min-height:100vh;padding:var(--sp-6);background:radial-gradient(1100px 550px at 12% -10%, #eef2ff 0%, transparent 60%), radial-gradient(900px 500px at 110% 10%, #ecfeff 0%, transparent 55%), var(--canvas);justify-content:center;align-items:center;display:flex}
.auth-shell{width:100%;max-width:440px}
.auth-mark{align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-6);justify-content:center;display:flex}
.auth-mark-badge{border-radius:var(--r-sm);background:linear-gradient(135deg, var(--primary), #7c6cf0);color:#fff;width:34px;height:34px;box-shadow:var(--shadow-sm);justify-content:center;align-items:center;font-size:15px;font-weight:800;display:flex}
.auth-mark-name{font-family:var(--font-ui);color:var(--ink);letter-spacing:-.01em;font-size:15px;font-weight:700}
.auth-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);padding:var(--sp-8) var(--sp-8) var(--sp-6)}
.auth-panel h2{font-family:var(--font-ui);letter-spacing:-.02em;color:var(--ink);text-align:center;margin:0 0 6px;font-size:24px;font-weight:700}
.auth-subtitle{color:var(--muted);text-align:center;margin:0 0 28px;font-size:14px;line-height:1.5}
.auth-field{margin-bottom:var(--sp-4)}
.auth-field label{color:var(--ink-soft);margin-bottom:6px;font-size:13px;font-weight:600;display:block}
.auth-field input{border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface-sunken);width:100%;font-size:14.5px;font-family:var(--font-ui);color:var(--ink);outline:none;padding:12px 14px}
.auth-field input:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-ring)}
.auth-field input::placeholder{color:var(--faint)}
.auth-links{margin-top:var(--sp-5);text-align:center;color:var(--muted);gap:var(--sp-2);flex-direction:column;font-size:13.5px;display:flex}
.auth-links a{color:var(--primary);font-weight:600;text-decoration:none}
.auth-links a:hover{text-decoration:underline}
.banner{align-items:flex-start;gap:var(--sp-3);padding:13px var(--sp-4);border-radius:var(--r-md);border:1px solid;font-size:14px;font-weight:500;line-height:1.5;display:flex;margin-top:16px}
.banner-warning{background:var(--warning-soft);color:var(--warning-dark);border-color:#fde68a}
</style>
</head>
<body>

<div class="auth-screen">
  <div class="auth-shell">
    <div class="auth-mark">
      <div class="auth-mark-badge">&#9670;</div>
      <span class="auth-mark-name">SecureAuth</span>
    </div>
    <div class="auth-panel">
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Access your account securely</p>

      <form onsubmit="return false;">
        <div class="auth-field">
          <label for="e">Email</label>
          <input id="e" type="email" placeholder="you@company.com" />
        </div>
        <div class="auth-field">
          <label for="p">Password</label>
          <input id="p" type="password" placeholder="Enter password" />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>

      <div class="banner banner-warning">Account locked due to too many failed attempts. Try again in 12 minutes.</div>

      <div class="auth-links">
        <a href="#">Forgot password?</a>
        <span>Don't have an account? <a href="#">Register</a></span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
