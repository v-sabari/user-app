spring.application.name=day4

# =============================================================================
# SERVER PORT
# =============================================================================
server.port=${PORT:8080}

# =============================================================================
# DATABASE - POSTGRESQL (Neon) - CORRECTED FOR RENDER
# =============================================================================
# CRITICAL: Use environment variables WITHOUT fallbacks to localhost
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-soft-sun-aidy7d5e-pooler.c-4.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_fA93daNXEpzY}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL MUST use these Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false

# =============================================================================
# EMAIL CONFIG
# =============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================================================================
# Twilio SMS Configuration
# =============================================================================
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# =============================================================================
# FRONTEND RESET URL
# =============================================================================
app.frontend.reset-url=${FRONTEND_URL:http://localhost:5173}/reset-password

# =============================================================================
# SENTRY ERROR TRACKING
# =============================================================================
sentry.dsn=${SENTRY_DSN:}
sentry.environment=production
sentry.release=1.0.0
sentry.debug=false
sentry.traces-sample-rate=0.1
sentry.enable-tracing=true
sentry.send-client-name=true
sentry.include-local-variables=true
sentry.ignored-exceptions-for-transaction-name=org.springframework.security.access.AccessDeniedException

# =============================================================================
# LOGGING
# =============================================================================
logging.level.root=WARN
logging.level.com.example=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=WARN

logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================================================
# CONNECTION POOLING (HikariCP)
# =============================================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# =============================================================================
# GRACEFUL SHUTDOWN
# =============================================================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# =============================================================================
# THREAD POOL CONFIGURATION
# =============================================================================
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# =============================================================================
# ACTUATOR ENDPOINTS (Health monitoring)
# =============================================================================
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# =============================================================================
# TIMEOUT CONFIGURATIONS
# =============================================================================
server.connection-timeout=20000
server.tomcat.connection-timeout=20000
spring.mvc.async.request-timeout=30000

# =============================================================================
# JPA/HIBERNATE CONFIGURATION
# =============================================================================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =============================================================================
# CORS ALLOWED ORIGINS
# =============================================================================
frontend.allowed-origins=${FRONTEND_URL:http://localhost:5173}