spring.application.name=day4

# =============================================================================
# Day 86-87 ? SERVER PORT (required for Render)
# =============================================================================
# Render assigns a dynamic port via the PORT environment variable (commonly
# 10000) and routes public traffic to whatever port your app actually binds
# to. Without this line, Spring Boot defaults to 8080 always, and Render
# would fail to detect/route to your service correctly.
# Locally, no PORT env var exists, so it falls back to 8080 as before ?
# your local dev workflow is unaffected.
server.port=${PORT:8080}

# =============================================================================
# Day 86-87 ? DATABASE CONFIG (Cloud-ready, reads from environment variables)
# =============================================================================
# These ${VAR_NAME} placeholders are NOT real values. Spring Boot reads the
# actual values from environment variables at runtime ? locally from your
# system/IDE env vars, and on Render from the dashboard's "Environment"
# settings. This file is now 100% safe to commit to a public repo.
#
# Local default fallback (after the colon) lets this still work on your
# machine without setting env vars, IF you choose to. If you don't set
# DB_HOST locally, it falls back to localhost ? your existing local MySQL
# keeps working exactly as before, untouched.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:userdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================================================
# Day 86-87 ? EMAIL CONFIG (now reads from environment variables too)
# =============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================================================================
# Day 81 ? Twilio SMS Configuration (still disabled, unchanged)
# =============================================================================
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# =============================================================================
# Day 86-87 ? FRONTEND RESET URL (now reads from env var, defaults to local)
# =============================================================================
# Locally this still points to localhost:5173 (unchanged behavior).
# On Render, you'll set FRONTEND_URL to your real Vercel URL once deployed.
app.frontend.reset-url=${FRONTEND_URL:http://localhost:5173}/reset-password

# =============================================================================
# Day 86-87 ? CORS ALLOWED ORIGINS (used by SecurityConfig)
# =============================================================================
# Same FRONTEND_URL env var, reused here for CORS. Locally falls back to
# localhost:5173. On Render, set FRONTEND_URL once ? both this and the
# reset-password URL above pick it up automatically.
frontend.allowed-origins=${FRONTEND_URL:http://localhost:5173}