spring.application.name=day4

# =============================================================================
# SERVER PORT (required for Render)
# =============================================================================
# Render assigns a dynamic port via the PORT environment variable (commonly
# 10000) and routes public traffic to whatever port your app actually binds
# to. Locally, no PORT env var exists, so it falls back to 8080.
server.port=${PORT:8080}

# =============================================================================
# DATABASE CONFIG (Cloud-ready, reads from environment variables)
# =============================================================================
# Locally: if you don't set DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD
# as environment variables, this falls back to your local MySQL defaults
# (root user, localhost:3306, userdb, no password).
# On Render: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD are already
# set in the dashboard and pointing to your Railway MySQL ? confirmed
# working in production.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:userdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================================================
# EMAIL CONFIG
# =============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================================================================
# Day 81 ? Twilio SMS Configuration (still disabled)
# =============================================================================
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# =============================================================================
# FRONTEND RESET URL
# =============================================================================
# On Render, FRONTEND_URL is already set to your real Vercel URL.
# Locally, falls back to localhost:5173.
app.frontend.reset-url=${FRONTEND_URL:http://localhost:5173}/reset-password
# ===== SENTRY ERROR TRACKING =====
# Get your Sentry DSN from https://sentry.io
# Format: https://<key>@<organization>.ingest.sentry.io/<project-id>
sentry.dsn=${SENTRY_DSN:}
sentry.environment=production
sentry.release=1.0.0
sentry.debug=false

# Capture performance metrics (tracing)
sentry.traces-sample-rate=0.1
sentry.enable-tracing=true

# Capture HTTP requests/responses
sentry.send-client-name=true
sentry.include-local-variables=true

# Error filtering
sentry.ignored-exceptions-for-transaction-name=org.springframework.security.access.AccessDeniedException

# ===== LOGGING =====
logging.level.root=WARN
logging.level.com.example=INFO
logging.level.org.springframework.security=DEBUG

logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# =============================================================================
# CORS ALLOWED ORIGINS (used by SecurityConfig)
# =============================================================================
frontend.allowed-origins=${FRONTEND_URL:http://localhost:5173}